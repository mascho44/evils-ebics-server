<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVILS EBICS Server · Anmeldung</title>
  <style>
    :root { color-scheme: dark; --bg:#09111f; --panel:#111d31; --line:#243550; --text:#e8eef9; --muted:#9bb0ce; --accent:#4f9cff; --bad:#ff7b8c; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; color:var(--text); background:linear-gradient(135deg,#09111f,#101d34); }
    .card { width:min(360px,90vw); background:rgba(17,29,49,.93); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 14px 35px rgba(0,0,0,.16) }
    h1 { font-size:20px; margin:0 0 4px } h1 span { color:var(--accent) } p.subtitle { color:var(--muted); font-size:13px; margin:0 0 20px }
    form { display:grid; gap:14px } label { display:grid; gap:5px; color:var(--muted); font-size:12px }
    input { font:inherit; color:var(--text); background:#0b1525; border-radius:8px; border:1px solid var(--line); padding:9px 10px }
    button { cursor:pointer; background:var(--accent); color:#fff; border:0; font-weight:650; padding:10px 12px; border-radius:8px; margin-top:4px }
    button:hover { filter:brightness(1.12) }
    .error { color:var(--bad); font-size:13px; margin:0 0 14px }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>EVILS</span> EBICS Server</h1>
    <p class="subtitle">Anmeldung für Administratoren</p>
    <!-- Eigene, statische Fehlerseite statt eines JS-getriggerten Anzeigens auf login.html: wird
         die Anmeldung abgelehnt, verlinkt SecurityConfiguration hierher (kein Query-Parameter, kein
         JavaScript noetig) - ein Nutzer, dessen Browser aus irgendeinem Grund Inline-Skripte
         blockiert (Erweiterung, Einstellung), sah bisher gar keine Fehlermeldung: die Seite "lud
         einfach neu", ohne erkennbaren Unterschied zwischen richtigem und falschem Login. -->
    <p class="error">Anmeldung fehlgeschlagen. Benutzername, Passwort oder Code prüfen.</p>
    <form method="post" action="/login">
      <label>Benutzername <input type="text" name="username" autocomplete="username" required autofocus></label>
      <label>Passwort <input type="password" name="password" autocomplete="current-password" required></label>
      <label>2FA-Code <input type="text" name="totp" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="nur falls aktiviert"></label>
      <button type="submit">Anmelden</button>
    </form>
  </div>
</body>
</html>
