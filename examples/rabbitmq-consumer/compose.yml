name: evils-backend-reference
services:
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: evils-demo
      RABBITMQ_DEFAULT_PASS: local-test-only
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - broker:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  consumer:
    build: .
    environment:
      RABBITMQ_URL: amqp://evils-demo:local-test-only@rabbitmq:5672/%2F
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - inbox:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  broker:
  inbox:
